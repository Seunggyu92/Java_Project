spring:
  application:
    name: volunteer-integration
  datasource:
    # Oracle XE 18c/21c 기본값. SID 방식이면 jdbc:oracle:thin:@localhost:1521:XE
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:volunteer}
    password: ${DB_PASSWORD:volunteer}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: never          # 테이블은 SchemaInitializer가 직접 만든다 (app.db.init-schema)
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
  error:
    whitelabel:
      enabled: false

app:
  db:
    init-schema: true      # 테이블이 없으면 db/schema.sql 자동 실행
  data:
    load: true             # 서버 시작 때 facility 테이블이 비어 있으면 CSV를 적재
    dir: ./data            # 프로젝트 루트 기준 CSV 폴더
  page-size: 12

logging:
  level:
    com.volunteerintegration: INFO
