<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <section class="empty">
        <p class="empty-code" th:text="${status}">404</p>
        <h1 th:text="${status == 404} ? '페이지를 찾을 수 없습니다' : '문제가 생겼습니다'">페이지를 찾을 수 없습니다</h1>
        <p class="muted" th:text="${status == 404} ? '주소가 바뀌었거나 없는 항목입니다.' : '잠시 후 다시 시도해 주세요.'">설명</p>
        <a th:href="@{/}" href="#" class="btn btn-primary">홈으로</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
