<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - VolunteerIntegration</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">VolunteerIntegration</a></div>
    </header>

    <main class="auth-container">
        <h2>로그인</h2>
        <form>
            <div class="form-group">
                <label>이메일/아이디</label>
                <input type="text" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" placeholder="비밀번호를 입력하세요">
            </div>
            <button type="button" class="btn">로그인</button>
        </form>
        <p style="margin-top: 1rem;"><a th:href="@{/signup}">아직 회원이 아니신가요? 회원가입</a></p>
    </main>
</body>
</html>
