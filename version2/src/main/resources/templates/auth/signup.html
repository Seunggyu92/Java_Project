<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container auth">
    <div class="auth-card signup-card">
        <h1>회원가입</h1>
        <p class="muted">계정, 본인 정보, 관심 분야를 나눠 입력합니다.</p>
        <form class="signup-form" th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
            <div class="form-columns">
                <section class="form-block">
                    <h2>계정</h2>
                    <p class="block-hint">로그인할 때 사용합니다.</p>

                    <label for="name">이름</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요"
                           autocomplete="name" th:errorclass="is-invalid">
                    <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</p>

                    <label for="email">이메일</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="이메일을 입력하세요"
                           autocomplete="email" th:errorclass="is-invalid">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">오류</p>

                    <label for="password">비밀번호</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="8자 이상"
                           autocomplete="new-password" th:errorclass="is-invalid">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">오류</p>
                </section>

                <section class="form-block">
                    <h2>본인 정보</h2>
                    <p class="block-hint">연락, 지역, 헌혈 안내에 사용합니다.</p>

                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="010-1234-5678"
                           autocomplete="tel" th:errorclass="is-invalid">
                    <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">오류</p>

                    <label for="sido">지역</label>
                    <select id="sido" th:field="*{sido}" th:errorclass="is-invalid">
                        <option value="">지역을 선택하세요</option>
                        <option th:each="r : ${regions}" th:value="${r.shortName}" th:text="${r.fullName}">서울특별시</option>
                    </select>
                    <p class="field-error" th:if="${#fields.hasErrors('sido')}" th:errors="*{sido}">오류</p>

                    <fieldset>
                        <legend>혈액형</legend>
                        <div class="segmented">
                            <label th:each="b : ${bloodTypes}">
                                <input type="radio" th:field="*{bloodType}" th:value="${b}">
                                <span th:text="${b} + '형'">A형</span>
                            </label>
                        </div>
                        <p class="field-error" th:if="${#fields.hasErrors('bloodType')}" th:errors="*{bloodType}">오류</p>
                    </fieldset>
                </section>
            </div>

            <section class="form-block">
                <h2>관심 분야</h2>
                <p class="block-hint">하나 이상 고르면 그 분야를 추천에 반영합니다.</p>
                <div class="choice-grid">
                    <label th:each="c : ${categories}">
                        <input type="checkbox" th:field="*{interests}" th:value="${c.code}">
                        <span th:text="${c.icon} + ' ' + ${c.label}">환경정화</span>
                    </label>
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('interests')}" th:errors="*{interests}">오류</p>
            </section>

            <button type="submit" class="btn btn-primary">가입하기</button>
        </form>
        <p class="auth-switch"><a th:href="@{/login}" href="login.html">이미 계정이 있으신가요? 로그인</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
