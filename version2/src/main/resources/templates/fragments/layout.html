<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | VolunteerIntegration'">VolunteerIntegration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>

<body>

<header th:fragment="header" class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}" href="#">VolunteerIntegration</a>
        <nav class="nav">
            <a th:href="@{/}" href="#" th:classappend="${currentPath == '/'} ? 'active'">홈</a>
            <a th:href="@{/search}" href="#" th:classappend="${currentPath == '/search'} ? 'active'">봉사 찾기</a>
            <a th:href="@{/facilities}" href="#" th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/facilities')} ? 'active'">시설 찾기</a>
            <a th:href="@{/blood}" href="#" th:classappend="${currentPath == '/blood'} ? 'active'">헌혈의 집</a>
            <th:block th:if="${loginMember == null}">
                <a th:href="@{/login}" href="#" th:classappend="${currentPath == '/login'} ? 'active'">로그인</a>
                <a th:href="@{/signup}" href="#" th:classappend="${currentPath == '/signup'} ? 'active'">회원가입</a>
            </th:block>
            <th:block th:if="${loginMember != null}">
                <div class="nav-account">
                    <button type="button" class="nav-account-button"
                            th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/mypage')} ? 'active'"
                            aria-haspopup="true" aria-label="내 프로필">
                        <span th:text="${loginMember.name} + ' 님'">이름 님</span>
                    </button>
                    <div class="nav-dropdown" role="menu" aria-label="내 프로필">
                        <a role="menuitem" data-mypage="dashboard" th:href="@{/mypage#dashboard}" href="#">대시보드</a>
                        <a role="menuitem" data-mypage="records" th:href="@{/mypage#records}" href="#">활동 기록</a>
                        <a role="menuitem" data-mypage="favorites" th:href="@{/mypage#favorites}" href="#">관심 봉사</a>
                        <a role="menuitem" data-mypage="profile" th:href="@{/mypage#profile}" href="#">내 정보</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="link-button" role="menuitem">로그아웃</button>
                        </form>
                    </div>
                </div>
            </th:block>
        </nav>
    </div>
</header>

<div th:fragment="flash" th:if="${message != null}" class="flash" role="status" th:text="${message}">알림 메시지</div>

<footer th:fragment="footer" class="site-footer">
    <p>© 2026 VolunteerIntegration. All rights reserved.</p>
    <p class="muted small">데이터 출처: 행정안전부 1365 자원봉사포털 · 한국사회복지협의회 VMS · 사회복지시설 · 청소년활동/지원시설 · 대한적십자사 헌혈의 집 (공공데이터포털)</p>
</footer>

<!-- 봉사활동 카드 한 장 -->
<a th:fragment="volunteerCard(v)" class="card card-link" th:href="@{/volunteers/{id}(id=${v.id})}" href="#">
    <div class="card-top">
        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(v.category.code)}"
              th:text="${v.category.icon} + ' ' + ${v.category.label}">분야</span>
        <span class="muted small" th:text="${v.regionLabel}">지역</span>
    </div>
    <h3 class="card-title" th:text="${v.title}">봉사활동명</h3>
    <p class="card-org" th:text="${v.orgName}">기관명</p>
    <p class="card-meta">
        <span th:text="${v.dateLabel}">2021.12.31 (금)</span>
        <span th:if="${!#strings.isEmpty(v.timeLabel)}" th:text="${v.timeLabel}">14:00–17:00</span>
        <span th:text="${v.hours} + '시간'">3시간</span>
        <span th:if="${v.participantCount > 1}" th:text="${v.participantCount} + '명'">5명</span>
    </p>
</a>

<!-- 페이지 번호 -->
<nav th:fragment="pagination(result, cond)" class="pagination" th:if="${result.totalPages > 1}" aria-label="페이지">
    <a th:if="${result.hasPrev}" th:href="${cond.pageUrl(result.page - 1)}" href="#" class="page">이전</a>
    <th:block th:each="p : ${#numbers.sequence(result.startPage, result.endPage)}">
        <a th:href="${cond.pageUrl(p)}" href="#" class="page" th:classappend="${p == result.page} ? 'current'"
           th:text="${p}">1</a>
    </th:block>
    <a th:if="${result.hasNext}" th:href="${cond.pageUrl(result.page + 1)}" href="#" class="page">다음</a>
</nav>

</body>
</html>
